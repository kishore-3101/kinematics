<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="skyGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
  </defs>

  <!-- glow blobs -->
  <circle cx="480" cy="90" r="140" fill="url(#skyGlow)"/>
  <circle cx="90" cy="320" r="120" fill="url(#skyGlow)"/>

  <!-- orbit / axes motif -->
  <g stroke="#3B82F6" stroke-width="1" opacity="0.35">
    <circle cx="300" cy="180" r="150" fill="none"/>
    <circle cx="300" cy="180" r="110" fill="none"/>
  </g>

  <!-- floating dashed trajectory -->
  <path d="M60 260 Q 220 60 540 140" fill="none" stroke="#60A5FA" stroke-width="2" stroke-dasharray="6 10" opacity="0.7"/>
  <circle cx="60" cy="260" r="5" fill="#22C55E"/>
  <circle cx="540" cy="140" r="5" fill="#3B82F6"/>

  <!-- road -->
  <rect x="0" y="300" width="600" height="60" fill="url(#roadGrad)"/>
  <g stroke="#60A5FA" stroke-width="4" stroke-dasharray="24 18" opacity="0.6">
    <line x1="0" y1="330" x2="600" y2="330"/>
  </g>

  <!-- car sitting on road (script.js will float/move this group) -->
  <g id="heroCar" transform="translate(180,250) scale(1.1)">
    <ellipse cx="100" cy="88" rx="80" ry="8" fill="#000000" opacity="0.25"/>
    <path d="M20 65 Q25 40 55 38 L75 38 Q85 20 115 20 L140 20 Q160 20 168 40 L180 42 Q190 44 190 58 L190 65 Q190 72 183 72 L17 72 Q10 72 10 65 Q10 65 20 65 Z"
          fill="#2563EB" stroke="#1E293B" stroke-width="1.5"/>
    <path d="M82 38 Q90 24 112 24 L134 24 Q148 24 154 38 Z" fill="#93C5FD" opacity="0.85"/>
    <circle cx="182" cy="55" r="4" fill="#F0F9FF"/>
    <circle cx="55" cy="75" r="14" fill="#111827" stroke="#1E293B" stroke-width="2"/>
    <circle cx="150" cy="75" r="14" fill="#111827" stroke="#1E293B" stroke-width="2"/>
  </g>
</svg>
