<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 100" width="200" height="100">
  <defs>
    <linearGradient id="carBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="carGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="100" cy="88" rx="80" ry="8" fill="#000000" opacity="0.25"/>

  <!-- body -->
  <path d="M20 65 Q25 40 55 38 L75 38 Q85 20 115 20 L140 20 Q160 20 168 40 L180 42 Q190 44 190 58 L190 65 Q190 72 183 72 L17 72 Q10 72 10 65 Q10 65 20 65 Z"
        fill="url(#carBody)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- windows -->
  <path d="M82 38 Q90 24 112 24 L134 24 Q148 24 154 38 Z" fill="url(#carGlass)"/>
  <line x1="112" y1="24" x2="108" y2="38" stroke="#1E293B" stroke-width="1.2"/>

  <!-- headlight -->
  <circle cx="182" cy="55" r="4" fill="#F0F9FF"/>
  <!-- taillight -->
  <circle cx="18" cy="58" r="3.5" fill="#22C55E"/>

  <!-- wheels -->
  <g>
    <circle cx="55" cy="75" r="14" fill="#111827" stroke="#1E293B" stroke-width="2"/>
    <circle cx="55" cy="75" r="6" fill="#60A5FA"/>
  </g>
  <g>
    <circle cx="150" cy="75" r="14" fill="#111827" stroke="#1E293B" stroke-width="2"/>
    <circle cx="150" cy="75" r="6" fill="#60A5FA"/>
  </g>
</svg>
